<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mogibara Colour Room</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header site-header-top">
  <div class="brand">MOGIBARA</div>
  <div class="site-title">Mogibara Colour Room</div>
</header>

<section class="hero">
  <div class="hero-swatches">
    <span style="background:#0b9fde"></span>
    <span style="background:#38e1ff"></span>
    <span style="background:#ff6347"></span>
    <span style="background:#ffd700"></span>
    <span style="background:#32cd32"></span>
    <span style="background:#da70d6"></span>
  </div>

  <div class="cta-grid">
    <a class="cta-card" href="picker/index.html">
      <div class="cta-ico">🎨</div>
      <div class="cta-text">
        <b>Colour Picker</b>
        <span>Mix a colour and read it back in HEX / RGB / CMYK / HSV / HSL.</span>
      </div>
    </a>
    <a class="cta-card" href="library/index.html">
      <div class="cta-ico">📚</div>
      <div class="cta-text">
        <b>Colour Library</b>
        <span>Search and tap colours to see their full code card.</span>
      </div>
    </a>
    <a class="cta-card" href="shades/index.html">
      <div class="cta-ico">🌈</div>
      <div class="cta-text">
        <b>Colour Shades</b>
        <span>Browse ready-made palettes, or drop in a colour and generate your own.</span>
      </div>
    </a>
  </div>
</section>

<footer class="site-footer">© 2026 <b>MOGIBARA</b> — Colour Room</footer>

</body>
</html>
